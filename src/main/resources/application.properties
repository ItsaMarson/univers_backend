spring.application.name=univers_backend

server.port=8080

#Database Connection
spring.datasource.url = ${MYSQL_DB_ENDPOINT:jdbc:mysql://localhost:3306/univers}
spring.datasource.username = ${MYSQL_DB_USERNAME:root}
spring.datasource.password = ${MYSQL_DB_PASSWORD:root}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update 
#should change update to validate when production

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
server.error.include-stacktrace=never

mailjet.api.key=${MAILJET_API_KEY}
mailjet.api.secret=${MAILJET_API_SECRET}
mailjet.sender.email=${MAILJET_SENDER_EMAIL}
mailjet.template.id=${MAILJET_TEMPLATE_ID}
mailjet.template.id.forgot.password=${MAILJET_TEMPLATE_ID_FORGOT_PASSWORD}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secretKey=${JWT_SECRET_KEY}

# Storage Configuration
storage.location=${STORAGE_LOCATION:./storage}
storage.bucket.venues=univers-venues
storage.bucket.users=univers-users
storage.bucket.equipments=univers-equipments
storage.bucket.events=univers-events
storage.bucket.event_images=univers-event-images
storage.bucket.approved-letters=univers-approved-letters

# CORS Configuration (optional - only needed for separate frontend dev server)
# Comment out or remove this line in production when frontend is served from same origin
# cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Uncomment the line above only when running frontend dev server separately
